<title>Trend Radar</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:#000;margin:0;overflow:hidden;height:100vh;}
  .phone{position:fixed;top:0;bottom:0;left:50%;transform:translateX(-50%);width:calc(100vh * 9 / 16);max-width:100vw;background:#000;overflow:hidden;}
  .deck{position:absolute;inset:0;touch-action:none;}
  .card{position:absolute;inset:0;display:none;background:#000;}
  .card.on{display:block;}
  .slide{position:absolute;inset:0;display:none;background:#000;align-items:center;justify-content:center;}
  .slide.on{display:flex;}
  .slide video{width:100%;height:100%;object-fit:cover;display:block;background:#000;}

  .ov{position:absolute;inset:0;pointer-events:none;color:#fff;z-index:3;}
  .ov::before{content:"";position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(0,0,0,.4) 0%,rgba(0,0,0,0) 20%,rgba(0,0,0,0) 55%,rgba(0,0,0,.68) 100%);}
  .ov>*{position:relative;}
  .top{position:absolute;top:15px;left:14px;right:14px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;pointer-events:auto;}
  .cat{justify-self:center;font-size:12px;font-weight:700;color:#fff;padding:5px 12px;border-radius:20px;white-space:nowrap;}
  .week{justify-self:start;display:flex;align-items:center;gap:5px;font-size:13px;font-weight:600;
    background:rgba(0,0,0,.3);padding:6px 12px;border-radius:20px;}
  .week svg{width:9px;height:9px;}
  .topicons{justify-self:end;display:flex;align-items:center;gap:12px;}
  .spk,.srch{width:21px;height:21px;opacity:.96;cursor:pointer;flex:0 0 auto;}
  .rail{position:absolute;right:11px;bottom:65px;display:flex;flex-direction:column;align-items:center;gap:19px;pointer-events:auto;}
  .rail .item{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;}
  .rail .ic{width:48px;height:48px;border-radius:50%;background:rgba(20,20,24,.55);display:flex;align-items:center;justify-content:center;background-size:cover;background-position:center;overflow:hidden;}
  .rail .ic svg{width:24px;height:24px;}
  .rail .ic.js-platform-ic svg{width:100%;height:100%;display:block;}
  .rail .ic.ic-mult{color:#fff;font-weight:800;letter-spacing:-.02em;line-height:1.05;text-align:center;padding:2px;}
  .rail .lab{font-size:10px;font-weight:600;text-shadow:0 1px 3px rgba(0,0,0,.5);text-align:center;}
  .mult .big{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;letter-spacing:-.02em;line-height:1.05;color:#fff;text-align:center;background:rgba(20,20,24,.55);}
  .mult .sub{text-align:center;}
  .mult .sub{font-size:10px;font-weight:600;color:rgba(255,255,255,.9);text-shadow:0 1px 3px rgba(0,0,0,.6);}
  .cap{position:absolute;left:16px;right:80px;bottom:44px;display:flex;flex-direction:column;gap:8px;pointer-events:auto;}
  .bybubble{align-self:flex-start;display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;color:#fff;background:rgba(255,255,255,.17);padding:4px 11px;border-radius:20px;text-decoration:none;}
  .bybubble svg{width:11px;height:11px;opacity:.85;}
  .title{font-size:16px;line-height:1.34;text-shadow:0 1px 4px rgba(0,0,0,.55);}
  .title .lead{font-weight:800;color:#fff;}
  .title .spec{color:rgba(255,255,255,.82);font-weight:500;}
  .dots{position:absolute;left:0;right:0;bottom:22px;display:flex;justify-content:center;gap:6px;}
  .dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.42);}
  .dots i.on{background:#fff;width:18px;border-radius:3px;}
  .center-btn{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:8;width:76px;height:76px;border-radius:50%;
    background:rgba(0,0,0,.42);color:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;cursor:pointer;pointer-events:none;opacity:0;transition:opacity .2s;}
  .center-btn.show{opacity:1;pointer-events:auto;}
  .center-btn svg{width:35px;height:35px;margin-left:3px;}
  .toast{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:9;background:rgba(20,20,24,.9);color:#fff;font-size:13.5px;font-weight:600;padding:10px 18px;border-radius:20px;opacity:0;pointer-events:none;transition:opacity .25s;white-space:nowrap;}
  .toast.show{opacity:1;}
  .scrim{position:absolute;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .28s;z-index:5;}
  .sheet{position:absolute;left:0;right:0;bottom:0;z-index:6;background:#fff;color:#17171a;border-radius:20px 20px 0 0;height:70%;
    transform:translateY(101%);transition:transform .34s cubic-bezier(.32,.72,.24,1);display:flex;flex-direction:column;padding:10px 22px 30px;overflow-y:auto;}
  .card.sheetopen .scrim{opacity:1;pointer-events:auto;}
  .card.sheetopen .sheet{transform:translateY(0);}
  .sheet h3{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px;}
  .sheet h3 svg{width:18px;height:18px;}
  .sheet .tn{font-size:13px;color:#6b6a64;margin:3px 0 16px;font-weight:500;}
  .sheet .bul{display:flex;gap:9px;margin-bottom:13px;font-size:13.5px;line-height:1.45;}
  .sheet .bul .d{font-weight:800;flex:0 0 auto;}
  .beast{margin-top:4px;background:#FAEEDA;border-radius:12px;padding:14px 16px;}
  .beast .bl{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#854F0B;margin-bottom:7px;}
  .beast .bt{font-size:12.5px;line-height:1.55;color:#4a3410;}
  .closex{position:absolute;top:16px;right:20px;font-size:22px;color:#9a9992;cursor:pointer;}
  .hint{position:absolute;bottom:70px;left:50%;transform:translateX(-50%);z-index:8;color:rgba(255,255,255,.75);
    font-size:12px;background:rgba(0,0,0,.4);padding:6px 13px;border-radius:20px;pointer-events:none;transition:opacity .4s;}

  .searchOv{position:absolute;inset:0;z-index:20;background:rgba(8,8,10,.98);display:none;flex-direction:column;padding:16px 16px 10px;}
  .searchOv.on{display:flex;}
  .searchOv .shead{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex:0 0 auto;}
  .searchOv .sbox{flex:1;display:flex;align-items:center;gap:9px;background:rgba(255,255,255,.13);border-radius:20px;padding:10px 14px;}
  .searchOv .sbox svg{width:17px;height:17px;color:rgba(255,255,255,.55);flex:0 0 auto;}
  .searchOv input{flex:1;background:transparent;border:0;outline:0;color:#fff;font-size:15px;font-family:inherit;min-width:0;}
  .searchOv input::placeholder{color:rgba(255,255,255,.45);}
  .searchOv .scancel{color:rgba(255,255,255,.85);font-size:14px;font-weight:600;cursor:pointer;flex:0 0 auto;padding:4px 2px;}
  .searchOv .sres{overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:2px;-webkit-overflow-scrolling:touch;}
  .searchOv .srow{display:flex;align-items:center;gap:12px;padding:11px 6px;border-radius:10px;cursor:pointer;}
  .searchOv .srow:active{background:rgba(255,255,255,.08);}
  .searchOv .srow .spill{font-size:10px;font-weight:700;color:#fff;padding:4px 10px;border-radius:20px;flex:0 0 auto;white-space:nowrap;}
  .searchOv .srow .stxt{color:#fff;font-size:14px;line-height:1.35;min-width:0;}
  .searchOv .srow .stxt b{font-weight:800;}
  .searchOv .srow .ssub{display:block;color:rgba(255,255,255,.5);font-size:12px;margin-top:2px;}
  .searchOv .sempty{color:rgba(255,255,255,.5);font-size:13px;padding:26px 6px;text-align:center;}

  .weekDD{position:absolute;top:54px;left:14px;z-index:19;background:#1c1c1f;border-radius:14px;padding:6px;display:none;box-shadow:0 8px 24px rgba(0,0,0,.4);min-width:200px;}
  .weekDD.on{display:block;}
  .weekDD .wopt{display:flex;align-items:center;gap:9px;padding:10px 12px;border-radius:9px;color:rgba(255,255,255,.82);font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap;}
  .weekDD .wopt:active{background:rgba(255,255,255,.08);}
  .weekDD .wopt.cur{color:#fff;}
  .weekDD .wopt .dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.28);flex:0 0 auto;}
  .weekDD .wopt.cur .dot{background:#E24B4A;}
  .weekDD .wopt .badge{margin-left:auto;font-size:9.5px;font-weight:800;color:#E24B4A;text-transform:uppercase;letter-spacing:.05em;padding-left:10px;}
  .weekDD .archive-opt{margin-top:4px;border-top:1px solid rgba(255,255,255,.1);padding-top:12px;color:rgba(255,255,255,.6);}
  .weekDD .archive-opt .dot{background:transparent;}
</style>

    vd.addEventListener('canplay',function(){ if(vd===active) ensureActivePlay(); });
    sl.appendChild(vd); card.appendChild(sl);
    card.__slides.push(sl); card.__vids.push(vd); vids.push(vd);
  });
  var dots=c.slides.map(function(_,i){return '<i class="'+(i===0?'on':'')+'"></i>';}).join('');
  var titleHTML='<span class="lead">'+c.title[0]+'</span>'+(c.title[1]?' <span class="spec">'+c.title[1]+'</span>':'');
  var ov=document.createElement('div'); ov.className='ov';
  ov.innerHTML='<div class="top"><div class="week">'+WEEKINFO[c.week].label+' '+IC.chev+'</div>'
    +'<div class="cat" style="background:'+TYPE[c.type]+'">'+c.label+'</div>'
    +'<div class="topicons"><div class="spk js-spk">'+IC.mute+'</div><div class="srch">'+IC.search+'</div></div></div>'
    +'<div class="rail"><div class="item mult"><div class="big js-views-big"></div><div class="sub">views</div></div>'
    +'<div class="item"><div class="ic ic-mult js-mult-circle"></div><div class="lab">vs channel<br>avg</div></div>'
    +'<div class="item js-src"><div class="ic js-platform-ic">'+IC.link+'</div></div>'
    +'<div class="item js-info"><div class="ic">'+IC.info+'</div></div>'
    +'<div class="item js-share"><div class="ic">'+IC.share+'</div></div></div>'
    +'<div class="cap"><a class="bybubble js-by" target="_blank" rel="noopener" style="display:none">'+IC.link+'<span class="js-byn"></span></a>'
    +'<div class="title">'+titleHTML+'</div></div><div class="dots js-dots">'+dots+'</div>';
  card.appendChild(ov);
  var scrim=document.createElement('div'); scrim.className='scrim';
  var sheet=document.createElement('div'); sheet.className='sheet';
  var bul=c.takeaways.map(function(t){return '<div class="bul"><span class="d" style="color:'+TYPE[c.type]+'">&bull;</span><span>'+t+'</span></div>';}).join('');
  var beast=c.beastify?'<div class="beast"><div class="bl">Beastify idea</div><div class="bt">'+c.beastify+'</div></div>':'';
  sheet.innerHTML='<div class="closex">&times;</div><h3>'+IC.info+' Insights</h3><div class="tn">'+(c.title[1]||c.title[0])+'</div>'+bul+beast;
  card.appendChild(scrim); card.appendChild(sheet);

  ov.querySelector('.js-info').addEventListener('click',function(e){e.stopPropagation();card.classList.add('sheetopen');centerBtn.classList.remove('show');});
  scrim.addEventListener('click',function(){card.classList.remove('sheetopen'); if(active&&active.paused) centerBtn.classList.add('show');});
  sheet.querySelector('.closex').addEventListener('click',function(){card.classList.remove('sheetopen'); if(active&&active.paused) centerBtn.classList.add('show');});
  ov.querySelector('.js-spk').addEventListener('click',function(e){e.stopPropagation();toggleSound();});
  ov.querySelector('.js-src').addEventListener('click',function(e){e.stopPropagation();var s=c.slides[card.__si];if(s.vu)window.open(s.vu,'_blank');});
  ov.querySelector('.js-share').addEventListener('click',function(e){e.stopPropagation();shareLink();});
  ov.querySelector('.srch').addEventListener('click',function(e){e.stopPropagation();openSearch();});
  ov.querySelector('.week').addEventListener('click',function(e){e.stopPropagation();toggleWeekDD();});

  card.__update=function(si){
    var s=c.slides[si];
    var vb=ov.querySelector('.js-views-big'); vb.textContent=s.v; vb.style.fontSize=multFontSize(s.v);
    var mc=ov.querySelector('.js-mult-circle'); mc.textContent=s.ml; mc.style.background=hexA(TIER[s.mt],.55); mc.style.fontSize=multFontSize(s.ml);
    var pIcon=ov.querySelector('.js-platform-ic'); var pi=platformIcon(s.vu);
    if(pi==='tiktok'){ pIcon.style.backgroundImage="url('icons/tiktok.png')"; pIcon.innerHTML=''; }
    else if(pi==='ig'){ pIcon.style.backgroundImage=''; pIcon.innerHTML=IC.ig; }
    else if(pi==='yt'){ pIcon.style.backgroundImage=''; pIcon.innerHTML=IC.yt; }
    else { pIcon.style.backgroundImage=''; pIcon.innerHTML=IC.link; }
    var by=ov.querySelector('.js-by');
    if(s.byn){by.style.display='inline-flex';by.href=s.byu||'#';by.querySelector('.js-byn').textContent=s.byn;}
    else by.style.display='none';
    ov.querySelectorAll('.js-dots i').forEach(function(d,i){d.className=i===si?'on':'';});
  };
  card.__update(0);
  cards.push(card); deck.appendChild(card);
});
}
buildCardsFromData(CARDS);

function recomputeVis(){ visIdx=[]; cards.forEach(function(c,i){ if(c.__c.week===currentWeek) visIdx.push(i); }); }
function loadWeekVideos(week){
  cards.forEach(function(c){
    if(c.__c.week!==week) return;
    c.__vids.forEach(function(vd){
      if(!vd.src){ vd.src=vd.__src; vd.poster=vd.__poster; }
    });
  });
}
recomputeVis();
loadWeekVideos(currentWeek);

// ---- week picker ----
var weekDD=document.getElementById('weekDD');
var archiveLoaded=false, archiveLoading=false;
function loadArchive(cb){
  if(archiveLoaded){ cb&&cb(); return; }
  if(archiveLoading) return;
  archiveLoading=true;
  fetch('archive-cards.json').then(function(r){return r.json();}).then(function(data){
    data.weekOrder.forEach(function(w){ if(WEEKORDER.indexOf(w)<0) WEEKORDER.push(w); });
    for(var k in data.weekInfo){ WEEKINFO[k]=data.weekInfo[k]; }
    buildCardsFromData(data.cards);
    rebuildSearchIdx();
    archiveLoaded=true; archiveLoading=false;
    cb&&cb();
  }).catch(function(e){ archiveLoading=false; console.error('archive load failed',e); });
}
function renderWeekDD(){
  var opts=WEEKORDER.map(function(w,i){
    return '<div class="wopt'+(w===currentWeek?' cur':'')+'" data-w="'+w+'"><span class="dot"></span><span>'+WEEKINFO[w].label+'</span>'+(i===0?'<span class="badge">Latest</span>':'')+'</div>';
  }).join('');
  var archiveRow=archiveLoaded?'':'<div class="wopt archive-opt" id="archiveOpt"><span class="dot"></span><span>View archived weeks</span></div>';
  weekDD.innerHTML=opts+archiveRow;
  weekDD.querySelectorAll('.wopt[data-w]').forEach(function(el){
    el.addEventListener('click',function(e){e.stopPropagation();switchWeek(el.getAttribute('data-w'));weekDD.classList.remove('on');});
  });
  var archiveOpt=document.getElementById('archiveOpt');
  if(archiveOpt){
    archiveOpt.addEventListener('click',function(e){
      e.stopPropagation();
      archiveOpt.querySelector('span:last-child').textContent='Loading...';
      loadArchive(function(){ renderWeekDD(); });
    });
  }
}
function toggleWeekDD(){ if(weekDD.classList.contains('on')){weekDD.classList.remove('on');} else {renderWeekDD();weekDD.classList.add('on');} }
function switchWeek(week){
  if(week===currentWeek){ weekDD.classList.remove('on'); return; }
  currentWeek=week; recomputeVis(); loadWeekVideos(week); ci=0;
  if(visIdx.length){ cards[visIdx[0]].__si=0; show(); }
}
document.addEventListener('click',function(e){ if(!e.target.closest('#weekDD')&&!e.target.closest('.week')) weekDD.classList.remove('on'); });

var centerBtn=document.createElement('div'); centerBtn.className='center-btn'; centerBtn.innerHTML=IC.play;
document.querySelector('.phone').appendChild(centerBtn);

// ---- share ----
var toastEl=document.createElement('div'); toastEl.className='toast';
document.querySelector('.phone').appendChild(toastEl);
var toastTimer=null;
function showToast(msg){
  toastEl.textContent=msg; toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){toastEl.classList.remove('show');},1600);
}
function fallbackCopy(text){
  var ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.focus(); ta.select();
  try{document.execCommand('copy');}catch(e){}
  document.body.removeChild(ta);
}
function shareLink(){
  var url=window.location.href;
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(function(){showToast('Copied to clipboard');}).catch(function(){fallbackCopy(url);showToast('Copied to clipboard');});
  } else {
    fallbackCopy(url); showToast('Copied to clipboard');
  }
}

// ---- search ----
var searchOv=document.getElementById('searchOv'), searchInput=document.getElementById('searchInput'), searchRes=document.getElementById('searchRes');
var searchWasPlaying=false;
var searchIdx=[];
function rebuildSearchIdx(){
  searchIdx=cards.map(function(card){
    var c=card.__c;
    var bynames=c.slides.map(function(s){return s.byn||'';}).join(' ');
    return {label:c.label, title:(c.title[0]||'')+' '+(c.title[1]||''), text:(c.label+' '+c.title[0]+' '+(c.title[1]||'')+' '+bynames).toLowerCase()};
  });
}
rebuildSearchIdx();
function escapeHTML(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function highlight(text,q){
  if(!q) return escapeHTML(text);
  var i=text.toLowerCase().indexOf(q.toLowerCase());
  if(i<0) return escapeHTML(text);
  return escapeHTML(text.slice(0,i))+'<b>'+escapeHTML(text.slice(i,i+q.length))+'</b>'+escapeHTML(text.slice(i+q.length));
}
function renderSearch(q){
  var qq=(q||'').trim().toLowerCase();
  var rows=[];
  cards.forEach(function(card,i){
    var idx=searchIdx[i];
    if(!qq||idx.text.indexOf(qq)>-1) rows.push(i);
  });
  if(!rows.length){ searchRes.innerHTML='<div class="sempty">No matches for &ldquo;'+escapeHTML(q)+'&rdquo;</div>'; return; }
  searchRes.innerHTML=rows.map(function(i){
    var c=cards[i].__c;
    var subParts=[]; if(c.title[1]) subParts.push(c.title[1]); subParts.push(WEEKINFO[c.week].label);
    var sub='<span class="ssub">'+escapeHTML(subParts.join(' - '))+'</span>';
    return '<div class="srow" data-i="'+i+'"><div class="spill" style="background:'+TYPE[c.type]+'">'+c.label+'</div>'
      +'<div class="stxt">'+highlight(c.title[0],qq)+sub+'</div></div>';
  }).join('');
  searchRes.querySelectorAll('.srow').forEach(function(row){
    row.addEventListener('click',function(){
      var i=parseInt(row.getAttribute('data-i'),10);
      var wk=cards[i].__c.week;
      if(wk!==currentWeek){ currentWeek=wk; recomputeVis(); loadWeekVideos(wk); }
      ci=visIdx.indexOf(i); if(ci<0) ci=0;
      cards[i].__si=0; show(); closeSearch();
    });
  });
}
function openSearch(){
  searchWasPlaying=!!(active&&!active.paused);
  if(active&&!active.paused) active.pause();
  searchOv.classList.add('on'); searchInput.value=''; renderSearch('');
  setTimeout(function(){searchInput.focus();},50);
}
function closeSearch(){
  searchOv.classList.remove('on');
  if(searchWasPlaying) ensureActivePlay();
}
searchInput.addEventListener('input',function(){renderSearch(this.value);});
document.getElementById('searchCancel').addEventListener('click',closeSearch);

function syncSpk(){document.querySelectorAll('.js-spk').forEach(function(el){el.innerHTML=soundOn?IC.unmute:IC.mute;});}
function toggleSound(){ soundOn=!soundOn; if(active) active.muted=!soundOn; syncSpk(); }
function ensureActivePlay(){ if(!active)return; active.muted=!soundOn; var p=active.play(); if(p&&p.catch)p.catch(function(){}); }
function playActive(){ centerBtn.classList.remove('show'); ensureActivePlay(); }
function pauseActive(){ if(!active)return; active.pause(); centerBtn.classList.add('show'); }
function togglePlay(){ if(!active)return; if(active.paused) playActive(); else pauseActive(); }

var CARD_ANIM_MS=340, cardAnimating=false, pendingCardCleanup=null;
function clearCardTransform(c){ c.style.transition=''; c.style.transform=''; }
function show(dir,prevRealIdx){
  var realIdx=visIdx[ci]; var card=cards[realIdx];
  if(dir && prevRealIdx!==undefined && prevRealIdx!==realIdx){
    animateCardSwap(cards[prevRealIdx], card, dir);
  } else {
    if(pendingCardCleanup){ clearTimeout(pendingCardCleanup.timer); finishCardCleanup(pendingCardCleanup.oldCard,pendingCardCleanup.newCard); }
    cards.forEach(function(c,i){ c.classList.toggle('on', i===realIdx); if(i!==realIdx) c.classList.remove('sheetopen'); clearCardTransform(c); });
  }
  card.__slides.forEach(function(sl,i){ sl.classList.toggle('on', i===card.__si); });
  card.__update(card.__si);
  centerBtn.classList.remove('show');
  var vid=card.__vids[card.__si];
  vids.forEach(function(v){ if(v!==vid){ v.muted=true; v.autoplay=false; if(!v.paused) v.pause(); } });
  vid.autoplay=true; vid.setAttribute('preload','auto');
  active=vid; ensureActivePlay();
}
function finishCardCleanup(oldCard,newCard){
  oldCard.classList.remove('on'); oldCard.classList.remove('sheetopen');
  clearCardTransform(oldCard); clearCardTransform(newCard);
  cardAnimating=false; pendingCardCleanup=null;
}
function animateCardSwap(oldCard,newCard,dir){
  if(pendingCardCleanup){ clearTimeout(pendingCardCleanup.timer); finishCardCleanup(pendingCardCleanup.oldCard,pendingCardCleanup.newCard); }
  cardAnimating=true;
  var outY=dir>0?'-100%':'100%', inY=dir>0?'100%':'-100%';
  newCard.style.transition='none';
  newCard.style.transform='translateY('+inY+')';
  newCard.classList.add('on');
  newCard.getBoundingClientRect();
  var ease='transform '+CARD_ANIM_MS+'ms cubic-bezier(.22,.61,.36,1)';
  oldCard.style.transition=ease;
  newCard.style.transition=ease;
  requestAnimationFrame(function(){
    oldCard.style.transform='translateY('+outY+')';
    newCard.style.transform='translateY(0)';
  });
  pendingCardCleanup={oldCard:oldCard,newCard:newCard,timer:setTimeout(function(){ finishCardCleanup(oldCard,newCard); }, CARD_ANIM_MS+30)};
}
function goCard(d){ if(cardAnimating) return; var n=Math.max(0,Math.min(visIdx.length-1,ci+d)); if(n!==ci){ var prevRealIdx=visIdx[ci]; ci=n; cards[visIdx[ci]].__si=0; show(d,prevRealIdx); } }
function goSlide(d){ var card=cards[visIdx[ci]]; var n=Math.max(0,Math.min(card.__n-1,card.__si+d)); if(n!==card.__si){ card.__si=n; show(); } }

function unlockSound(){ if(!soundUnlocked){ soundUnlocked=true; soundOn=true; if(active) active.muted=false; syncSpk(); } }

// input: pointer drag (works for mouse + touch)
var pDown=false,psx,psy,pst;
deck.addEventListener('pointerdown',function(e){pDown=true;psx=e.clientX;psy=e.clientY;pst=Date.now();},{passive:true});
deck.addEventListener('pointercancel',function(){pDown=false;},{passive:true});
deck.addEventListener('pointerup',function(e){
  if(!pDown) return; pDown=false;
  var dx=e.clientX-psx,dy=e.clientY-psy,dt=Date.now()-pst;
  var wasUnlocked=soundUnlocked; unlockSound();
  if(Math.abs(dx)<14&&Math.abs(dy)<14&&dt<400){ // tap
    if(e.target.closest('.rail')||e.target.closest('.top')||e.target.closest('.sheet')||e.target.closest('.bybubble')||e.target.closest('.center-btn')) return;
    if(!wasUnlocked) return; togglePlay(); return;
  }
  if(Math.abs(dy)>Math.abs(dx)){ if(dy<-40)goCard(1); else if(dy>40)goCard(-1); }
  else { if(dx<-40)goSlide(1); else if(dx>40)goSlide(-1); }
},{passive:true});

// input: wheel / trackpad
var wlock=false;
deck.addEventListener('wheel',function(e){
  unlockSound();
  if(wlock) return;
  if(Math.abs(e.deltaY)>=Math.abs(e.deltaX)){ if(Math.abs(e.deltaY)>18){ wlock=true; goCard(e.deltaY>0?1:-1); setTimeout(function(){wlock=false;},480);} }
  else { if(Math.abs(e.deltaX)>18){ wlock=true; goSlide(e.deltaX>0?1:-1); setTimeout(function(){wlock=false;},480);} }
},{passive:true});

// input: keys
document.addEventListener('keydown',function(e){
  var k=e.key;
  if(searchOv.classList.contains('on')){ if(k==='Escape') closeSearch(); return; }
  if(['ArrowDown','ArrowUp','ArrowRight','ArrowLeft'].indexOf(k)<0) return;
  e.preventDefault(); var wasUnlocked=soundUnlocked; unlockSound(); if(!wasUnlocked) return;
  if(k==='ArrowDown')goCard(1); else if(k==='ArrowUp')goCard(-1); else if(k==='ArrowRight')goSlide(1); else if(k==='ArrowLeft')goSlide(-1);
});

centerBtn.addEventListener('click',function(e){e.stopPropagation();unlockSound();playActive();});

// start
show();
</script>
</body>
</html>
